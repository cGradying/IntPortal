[package]
name = "intportal"
version.workspace = true
description = "IntPortal: a PUP student's schedule, grades, deadlines, notes and study cards on the phone"
authors = ["cGradying"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "intportal_lib"
# No "rlib": with it cargo skips LTO for the whole lib (only bins, staticlibs
# and cdylibs can be LTO'd), and none of the release settings below took effect. So
# the desktop bin (src/main.rs, spec 053) includes lib.rs as source instead of linking it.
crate-type = ["staticlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
intportal-core = { path = "../crates/intportal-core" }
tokio = { version = "1", features = ["sync", "time", "rt"] }
# The backup file's salt (047 C10), and the keychain's on Apple and Android.
getrandom = "0.3"
intportal-ai = { path = "../crates/intportal-ai" }
intportal-llm = { path = "../crates/intportal-llm" }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Desktop (spec 053): the Credential Manager and the Secret Service.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2"
tauri-plugin-haptics = "2"
tauri-plugin-glance = { path = "../plugins/tauri-plugin-glance" }
tauri-plugin-download = { path = "../plugins/tauri-plugin-download" }
tauri-plugin-calendar = { path = "../plugins/tauri-plugin-calendar" }
tauri-plugin-camera = { path = "../plugins/tauri-plugin-camera" }
