<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUPSISPortal Architecture Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" integrity="sha384-en/ztfPSRkGfME4KIm05joYXynqzUgbsG5nMrj/xEFAHXkeZfO3yMK8QQ+mP7p1/" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; background: #FCFBFA; min-height: 100vh; padding: 2rem; color: #1C1917; }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { margin-bottom: 1.5rem; }
    .header-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
    .pulse-dot { width: 12px; height: 12px; background: #7A1128; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { color: #6B6560; font-size: 0.8rem; margin-left: 1.75rem; }
    .diagram-container { background: #FFFFFF; border-radius: 1rem; border: 1px solid #E8E2E0; padding: 1.5rem; overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; }
    .footer { text-align: center; margin-top: 1.25rem; color: #A39D98; font-size: 0.7rem; }
    .toolbar { display: flex; gap: 0.5rem; margin-left: auto; flex-shrink: 0; align-items: center; }
    .toolbar-toggle { background: transparent; border: none; color: #A39D98; cursor: pointer; font-size: 1.25rem; line-height: 1; padding: 0.25rem 0.5rem; border-radius: 0.375rem; transition: color 0.2s, background 0.2s; }
    .toolbar-toggle:hover { color: #6B6560; background: rgba(28, 25, 23, 0.06); }
    .toolbar-actions { display: none; gap: 0.5rem; }
    .toolbar.expanded .toolbar-actions { display: flex; }
    .toolbar-actions button { background: #F5F2F0; border: 1px solid #E8E2E0; color: #6B6560; padding: 0.375rem 0.75rem; border-radius: 0.375rem; font-family: inherit; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .toolbar-actions button:hover { background: #EEE8E5; color: #1C1917; border-color: #D8D0CC; }
    @media print { body { background: #FCFBFA; padding: 1rem; } .toolbar { display: none !important; } }
  </style>
</head>
<body>
  <div class="container" id="report-container">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>PUPSISPortal Architecture</h1>
        <div class="toolbar">
          <div class="toolbar-actions">
            <button onclick="copyAsImage(this)">📋 Copy</button>
            <button onclick="downloadPNG(this)">🖼️ PNG</button>
            <button onclick="downloadPDF(this)">📄 PDF</button>
          </div>
          <button class="toolbar-toggle" onclick="this.parentElement.classList.toggle('expanded')" title="Export options" aria-label="Export options">⋯</button>
        </div>
      </div>
      <p class="subtitle">Native macOS app, single process — headless SIS session, local storage, native SwiftUI, local-only AI</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 500">
        <defs>
          <marker id="arrowhead" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 9 3, 0 6" fill="#8A8480" />
          </marker>
          <marker id="arrowhead-accent" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 9 3, 0 6" fill="#B13E34" />
          </marker>
          <marker id="arrowhead-gold" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 9 3, 0 6" fill="#A37314" />
          </marker>
        </defs>

        <!-- External systems, top -->
        <rect x="20" y="20" width="140" height="50" rx="6" fill="rgba(63, 81, 122, 0.05)" stroke="#3F517A" stroke-opacity="0.7" stroke-width="1.5"/>
        <text x="90" y="42" fill="#1C1917" font-size="11" font-weight="600" text-anchor="middle">PUP SIS</text>
        <text x="90" y="58" fill="#6B6560" font-size="8.5" text-anchor="middle">sis8.pup.edu.ph</text>

        <rect x="840" y="20" width="140" height="50" rx="6" fill="rgba(63, 81, 122, 0.05)" stroke="#3F517A" stroke-opacity="0.7" stroke-width="1.5"/>
        <text x="910" y="42" fill="#1C1917" font-size="11" font-weight="600" text-anchor="middle">Google Calendar</text>
        <text x="910" y="58" fill="#6B6560" font-size="8.5" text-anchor="middle">direct OAuth (PKCE)</text>

        <rect x="840" y="85" width="140" height="50" rx="6" fill="rgba(63, 81, 122, 0.05)" stroke="#3F517A" stroke-opacity="0.7" stroke-width="1.5"/>
        <text x="910" y="107" fill="#1C1917" font-size="11" font-weight="600" text-anchor="middle">Calendar.app</text>
        <text x="910" y="123" fill="#6B6560" font-size="8.5" text-anchor="middle">EventKit</text>

        <!-- App boundary -->
        <rect x="190" y="10" width="610" height="300" rx="12" fill="rgba(163, 115, 20, 0.03)" stroke="#A37314" stroke-width="1" stroke-dasharray="8,4"/>
        <text x="202" y="27" fill="#A37314" font-size="10" font-weight="600">PUPSISPortal.app — one process, native SwiftUI</text>

        <!-- Session & Scraping -->
        <rect x="210" y="44" width="270" height="60" rx="6" fill="rgba(46, 90, 79, 0.06)" stroke="#2E5A4F" stroke-width="1.5"/>
        <text x="345" y="67" fill="#1C1917" font-size="11" font-weight="600" text-anchor="middle">Session &amp; Scraping</text>
        <text x="345" y="84" fill="#6B6560" font-size="8.5" text-anchor="middle">PortalController — hidden WKWebView, never shown</text>

        <!-- Local Storage -->
        <rect x="520" y="44" width="260" height="60" rx="6" fill="rgba(92, 49, 95, 0.06)" stroke="#5C315F" stroke-width="1.5"/>
        <text x="650" y="67" fill="#1C1917" font-size="11" font-weight="600" text-anchor="middle">Local Storage</text>
        <text x="650" y="84" fill="#6B6560" font-size="8.5" text-anchor="middle">NotesStore / ScheduleStore/ GradesStore + Keychain</text>

        <!-- Native UI -->
        <rect x="210" y="129" width="570" height="55" rx="6" fill="rgba(122, 17, 40, 0.06)" stroke="#7A1128" stroke-width="1.5"/>
        <text x="495" y="152" fill="#1C1917" font-size="11" font-weight="600" text-anchor="middle">Native UI — SwiftUI</text>
        <text x="495" y="169" fill="#6B6560" font-size="8.5" text-anchor="middle">WeekGrid • AgendaView • GradesView • AssistantFloating</text>

        <!-- AI Assistant -->
        <rect x="210" y="209" width="570" height="65" rx="6" fill="rgba(177, 62, 52, 0.06)" stroke="#B13E34" stroke-width="1.5"/>
        <text x="495" y="232" fill="#1C1917" font-size="11" font-weight="600" text-anchor="middle">AI Assistant — local-only, opt-in</text>
        <text x="495" y="249" fill="#6B6560" font-size="8.5" text-anchor="middle">AssistantEngine + RAGQuery over your notes</text>
        <text x="495" y="263" fill="#B13E34" font-size="8" text-anchor="middle">reads/writes notes &amp; events — never deletes, never touches a grade</text>

        <!-- Local models boundary -->
        <rect x="190" y="340" width="610" height="130" rx="12" fill="rgba(163, 115, 20, 0.03)" stroke="#A37314" stroke-width="1" stroke-dasharray="8,4"/>
        <text x="202" y="357" fill="#A37314" font-size="10" font-weight="600">Local models on this Mac — no cloud, ever</text>

        <rect x="220" y="375" width="270" height="65" rx="6" fill="rgba(163, 115, 20, 0.07)" stroke="#A37314" stroke-width="1.5"/>
        <text x="355" y="398" fill="#1C1917" font-size="11" font-weight="600" text-anchor="middle">Ollama</text>
        <text x="355" y="415" fill="#6B6560" font-size="8.5" text-anchor="middle">chat + embeddings · localhost:11434</text>

        <rect x="510" y="375" width="270" height="65" rx="6" fill="rgba(163, 115, 20, 0.07)" stroke="#A37314" stroke-width="1.5"/>
        <text x="645" y="398" fill="#1C1917" font-size="11" font-weight="600" text-anchor="middle">llama.cpp</text>
        <text x="645" y="415" fill="#6B6560" font-size="8.5" text-anchor="middle">grounded RAG answers · localhost:8080</text>

        <!-- Arrows -->
        <path d="M 160 55 L 208 70" fill="none" stroke="#B13E34" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowhead-accent)"/>
        <text x="128" y="92" fill="#B13E34" font-size="8" text-anchor="middle">headless</text>
        <text x="128" y="103" fill="#B13E34" font-size="8" text-anchor="middle">sign-in</text>

        <line x1="480" y1="74" x2="518" y2="74" stroke="#8A8480" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="499" y="69" fill="#6B6560" font-size="8" text-anchor="middle">cache</text>

        <line x1="650" y1="104" x2="650" y2="127" stroke="#8A8480" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="345" y1="127" x2="345" y2="104" stroke="#8A8480" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="500" y="120" fill="#6B6560" font-size="8" text-anchor="middle">render</text>

        <line x1="495" y1="184" x2="495" y2="207" stroke="#B13E34" stroke-width="1.5" marker-end="url(#arrowhead-accent)"/>
        <text x="545" y="199" fill="#6B6560" font-size="8" text-anchor="middle">chat / commands</text>

        <path d="M 790 240 Q 812 185 782 187" fill="none" stroke="#B13E34" stroke-width="1.5" marker-end="url(#arrowhead-accent)"/>
        <text x="838" y="185" fill="#B13E34" font-size="8" text-anchor="middle">notes • events</text>
        <text x="838" y="197" fill="#B13E34" font-size="8" text-anchor="middle">grades (read)</text>

        <line x1="400" y1="274" x2="378" y2="373" stroke="#A37314" stroke-width="1.5" marker-end="url(#arrowhead-gold)"/>
        <text x="322" y="325" fill="#6B6560" font-size="8" text-anchor="middle">chat + embed</text>
        <text x="322" y="336" fill="#6B6560" font-size="8" text-anchor="middle">(HTTP, localhost)</text>

        <line x1="600" y1="274" x2="632" y2="373" stroke="#A37314" stroke-width="1.5" marker-end="url(#arrowhead-gold)"/>
        <text x="668" y="325" fill="#6B6560" font-size="8" text-anchor="middle">grounded</text>
        <text x="668" y="336" fill="#6B6560" font-size="8" text-anchor="middle">answer</text>

        <line x1="782" y1="150" x2="838" y2="112" stroke="#8A8480" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="838" y="145" fill="#6B6560" font-size="8" text-anchor="middle">EventKit</text>

        <line x1="782" y1="144" x2="838" y2="52" stroke="#8A8480" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="820" y="90" fill="#6B6560" font-size="8" text-anchor="middle">export</text>
      </svg>
    </div>

    <p class="footer">PUPSISPortal • v1.2.0 • github.com/cGradying/IntPortal</p>
  </div>

  <script>
    async function copyAsImage(btn) {
      const orig = btn.textContent;
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#FCFBFA', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        btn.textContent = '✓ Copied!';
      } catch (e) { btn.textContent = '✗ Failed'; }
      setTimeout(() => btn.textContent = orig, 2000);
    }
    async function downloadPNG(btn) {
      const orig = btn.textContent;
      btn.textContent = '⏳ ...';
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#FCFBFA', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const link = document.createElement('a');
        link.download = 'diagram.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        btn.textContent = '✓ Done!';
      } catch (e) { btn.textContent = '✗ Failed'; }
      setTimeout(() => btn.textContent = orig, 2000);
    }
    async function downloadPDF(btn) {
      const orig = btn.textContent;
      btn.textContent = '⏳ ...';
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#FCFBFA', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const orientation = canvas.width > canvas.height ? 'landscape' : 'portrait';
        const pdf = new jsPDF({ orientation, unit: 'px', format: [canvas.width, canvas.height], hotfixes: ['px_scaling'] });
        pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
        pdf.save('diagram.pdf');
        btn.textContent = '✓ Done!';
      } catch (e) { btn.textContent = '✗ Failed'; }
      setTimeout(() => btn.textContent = orig, 2000);
    }
  </script>
</body>
</html>
