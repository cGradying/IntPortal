[package]
name = "tauri-plugin-download"
version.workspace = true
edition = "2021"
publish = false
description = "Model downloads that outlive the app: a background URLSession (iOS), a foreground service (Android), and free storage on both."
links = "tauri-plugin-download"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
