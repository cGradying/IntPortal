name: Feature request
description: Suggest something the app should do
labels: ["enhancement"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Both
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What do you want
      description: What problem it solves, and how you'd expect it to work
    validations:
      required: true
