name: iOS
on:
  push:
    branches: [main]
  pull_request:
    paths: [".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/target

# Proves the Swift plugins and the Xcode project build; desktop cargo never
# compiles them. Simulator only, so no signing.
permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: src-tauri/gen/apple
        run: |
          # Gitignored folders the Tauri build fills; XcodeGen wants them to exist.
          mkdir -p Externals assets
          APPLE_DEVELOPMENT_TEAM= INTPORTAL_APP_GROUP=false xcodegen generate
      - run: pnpm tauri ios build --target aarch64-sim --debug
      - name: App size
        run: du -sh src-tauri/gen/apple/build/arm64-sim/IntPortal.app

  # The unsigned app for sideloading (spec 050 C17), as an artifact; a release
  # gets it from scripts/release.sh.
  unsigned-ipa:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: brew install xcodegen
      - run: scripts/ipa.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intportal-unsigned-ipa
          path: dist/IntPortal-*-unsigned.ipa
