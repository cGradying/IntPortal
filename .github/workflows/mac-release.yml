# Builds the .dmg/.zip and attaches them (plus an appcast) to a GitHub
# release on a version tag push. Mirrors windows-build.yml's role for the
# Windows side (Phase G of .claude/plans/alright-lets-plan-the-drifting-gadget.md)
# — mac's manual make_dmg.sh flow, made reproducible instead of hand-run per
# release.
#
# Self-signed, not Apple Developer ID (no paid account) — but CI signs every
# release with the SAME identity every time (MACOS_SIGNING_P12 secret), which
# is what lets Sparkle's in-app auto-update (Sources/PUPSISPortalApp/Core/UpdaterBridge.swift)
# verify one release against the next. The .dmg download still needs the
# documented Gatekeeper right-click-open step in README's Install section —
# that's unchanged. Auto-updates installed via Sparkle skip it entirely:
# Sparkle strips com.apple.quarantine from the swapped-in bundle itself.
#
# Two ways in: a manually pushed "v*.*.*" tag (the original path — still
# works for a hand-cut release), or `workflow_call` from auto-release.yml,
# which computes the next version and calls this directly with a `tag`
# input. It has to be workflow_call, not a second tag push: a tag pushed
# using the built-in GITHUB_TOKEN deliberately does NOT trigger another
# workflow's `on: push` (GitHub's own anti-recursion rule) — confirmed the
# hard way when auto-release.yml's first real run tagged v1.5.1 and this
# workflow silently never started. `secrets: inherit` on the caller's side
# is what makes the signing/appcast secrets below available either way.
name: Mac release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      tag:
        description: 'Version tag, e.g. "v1.5.1" — only set when called from auto-release.yml'
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The one thing every later step needs: which tag this release is.
      # Direct tag-push trigger already has it as GITHUB_REF_NAME; the
      # workflow_call path has no tag ref at all (it's running on main's
      # commit, before or as the tag is pushed), so it comes in as an input.
      - name: Resolve tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Run tests
        run: swift test

      - name: Import signing identity
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASS: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          KC_PASS: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security create-keychain -p "$KC_PASS" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KC_PASS" build.keychain
          security import "$RUNNER_TEMP/id.p12" -k build.keychain -P "$P12_PASS" -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" build.keychain
          # Self-signed: codesign needs the cert trusted, or find-identity -v
          # won't list it and make_mac_app.sh silently falls back to ad-hoc.
          openssl pkcs12 -in "$RUNNER_TEMP/id.p12" -passin "pass:$P12_PASS" -clcerts -nokeys -legacy -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          rm -f "$RUNNER_TEMP/id.p12" "$RUNNER_TEMP/cert.pem"
          # Fails the job loudly here rather than letting make_mac_app.sh's
          # own CI guard catch it three steps later.
          security find-identity -v -p codesigning | grep -qF "PUPSISPortal CI Signing"

      - name: Build .dmg
        run: |
          VERSION="${TAG#v}"
          Scripts/make_dmg.sh "$VERSION"

      # Pinned, not "latest main" — a static llama-server is a compatibility
      # surface for this app's whole AI feature, and an unreviewed upstream
      # bump landing silently in a release would be a bad way to find that
      # out. Bump this deliberately, not automatically.
      - name: Cache universal llama-server
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: dist-llama/llama-server
          key: llama-server-universal-b10648

      - name: Build universal llama-server
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch b10648 --depth 1 https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          cd "$RUNNER_TEMP/llama.cpp"
          # LLAMA_OPENSSL=OFF is load-bearing, not cosmetic: it defaults ON
          # (vendor/cpp-httplib/CMakeLists.txt's LLAMA_OPENSSL branch calls
          # find_package(OpenSSL) unconditionally), and the runner's Homebrew
          # OpenSSL is arm64-only — the x86_64 cross-compile then fails at
          # link time with "symbol(s) not found for architecture x86_64" on
          # every X509_* symbol. (`LLAMA_SERVER_SSL` — tried first — isn't a
          # real option in this tree at all; it silently no-ops and the build
          # still fails the same way. Confirmed live: runs 33072940139 and
          # 33074429477.) This app never uses llama-server's HTTPS mode in
          # the first place, so there is nothing lost by forcing it off.
          #
          # GGML_NATIVE=OFF is equally load-bearing for the x86_64 slice:
          # left at its default (ON), ggml's "-march=native" resolves against
          # the *host* compiler on this arm64 runner, which emits
          # "-march=apple-m4" — a target CPU name clang's x86_64 backend has
          # never heard of, so every ggml-cpu translation unit fails to
          # compile. Confirmed live and locally reproduced cross-compiling on
          # an arm64 Mac. Harmless for the arm64 slice too (it already builds
          # correctly either way), so it's in COMMON_FLAGS rather than only
          # the x86_64 invocation.
          COMMON_FLAGS="-DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DGGML_NATIVE=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=ON"
          # arm64: Metal, embedded so the binary needs no .metallib alongside it.
          cmake -B build-arm64 -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON $COMMON_FLAGS
          cmake --build build-arm64 --target llama-server -j"$(sysctl -n hw.ncpu)"
          # x86_64: no Metal there — CPU + Accelerate instead.
          cmake -B build-x86_64 -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DGGML_METAL=OFF -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=Apple $COMMON_FLAGS
          cmake --build build-x86_64 --target llama-server -j"$(sysctl -n hw.ncpu)"
          mkdir -p "$GITHUB_WORKSPACE/dist-llama"
          lipo -create build-arm64/bin/llama-server build-x86_64/bin/llama-server \
            -output "$GITHUB_WORKSPACE/dist-llama/llama-server"

      - name: Verify universal llama-server
        run: |
          lipo -info dist-llama/llama-server
          otool -L dist-llama/llama-server
          # Fails loudly if a Homebrew/rpath dependency ever sneaks back in —
          # the whole point of building from source instead of vendoring brew's.
          ! otool -L dist-llama/llama-server | grep -qE '@rpath|/opt/homebrew|/usr/local'

      - name: Fetch model weights
        run: |
          mkdir -p dist-models
          # URLs and expected sizes both come straight from ModelCatalog.swift
          # so this can never silently drift from what the app itself expects.
          curl -fL -o dist-models/Qwen3-1.7B-Q4_K_M.gguf \
            "https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf"
          curl -fL -o dist-models/nomic-embed-text-v1.5.Q4_K_M.gguf \
            "https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.Q4_K_M.gguf"
          [ "$(stat -f%z dist-models/Qwen3-1.7B-Q4_K_M.gguf)" = "1107409472" ]
          [ "$(stat -f%z dist-models/nomic-embed-text-v1.5.Q4_K_M.gguf)" = "84106624" ]

      - name: Build .dmg (with-AI)
        env:
          BUNDLE_LLAMA_SERVER: dist-llama/llama-server
          BUNDLE_MODELS: dist-models
        run: |
          VERSION="${TAG#v}"
          Scripts/make_dmg.sh "$VERSION"

      - name: Build .zip update payload
        run: |
          VERSION="${TAG#v}"
          VERSION="$VERSION" Scripts/make_mac_app.sh "$RUNNER_TEMP/zipstage"
          # ditto, not zip -r: preserves the symlinks the framework's own
          # code signature is computed over, same reason make_mac_app.sh
          # uses ditto (not cp -R) to embed Sparkle.framework in the first
          # place.
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/zipstage/PUPSISPortal.app" "dist/PUPSISPortal-$VERSION.zip"

      - name: Generate appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          BIN="$(find .build/artifacts -type d -name bin -path '*Sparkle*' -print -quit)"
          mkdir -p "$RUNNER_TEMP/appcast"
          cp dist/*.zip "$RUNNER_TEMP/appcast/"
          echo "$SPARKLE_ED_PRIVATE_KEY" | "$BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/cGradying/IntPortal/releases/download/$TAG/" \
            --link "https://github.com/cGradying/IntPortal/releases/latest" \
            -o dist/appcast.xml \
            "$RUNNER_TEMP/appcast/"
          cat dist/appcast.xml

      # README tells users twice to verify the download against "the posted
      # checksum" (Install, and Future plans). Since the builds are
      # unnotarized, this is the only integrity check a user has for the
      # first, manual .dmg install — the .zip is covered separately by
      # Sparkle's own EdDSA signature in the appcast.
      - name: Checksum
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(printf '### SHA-256\n\n```\n%s\n```\n' "$(cat dist/SHA256SUMS.txt)")"
          gh release create "$TAG" dist/*.dmg dist/*.zip dist/appcast.xml dist/SHA256SUMS.txt \
            --title "$TAG" --generate-notes --notes "$NOTES" \
            || gh release upload "$TAG" dist/*.dmg dist/*.zip dist/appcast.xml dist/SHA256SUMS.txt --clobber
