name: Android
on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/target

# Proves the release build (manifest merge, R8, the Kotlin plugins, llama.cpp
# for arm64) before a release, which CI never built and which broke 0.1.9 (#264).
# No release key here, so the APK is unsigned; scripts/emu.sh --release signs.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the release APK
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          # SQLCipher's vendored OpenSSL looks for <triple>-ranlib, which the NDK replaced with llvm-ranlib.
          bin="$(ls -d "$NDK_HOME"/toolchains/llvm/prebuilt/*/bin | head -1)"
          export RANLIB_aarch64_linux_android="$bin/llvm-ranlib" AR_aarch64_linux_android="$bin/llvm-ar"
          pnpm tauri android build --target aarch64 --apk
      - name: APK size
        run: ls -lh src-tauri/gen/android/app/build/outputs/apk/universal/release/
      - uses: actions/upload-artifact@v4
        with:
          name: intportal-release-unsigned
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          retention-days: 7
