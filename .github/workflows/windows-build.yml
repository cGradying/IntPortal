# Compiles the WinUI 3 Windows port (windows/PUPSISPortal.App) on a real
# Windows runner. This is a compile-only forcing-function, not a full CI
# pipeline: the app has never been built outside a mac session where WinUI's
# XAML compiler can't run, so this workflow's job is to turn that "unverified"
# into a visible green/red signal without hand-building on a local machine
# every round. It doesn't run the app or touch the live SIS — see
# windows/README.md "Building the WinUI app" for the runtime-verification
# steps that still need a real Windows box + a real account.
#
# Only win-x64 is built here; win-arm64 is a separate RID publish for release
# time (windows/README.md "Packaging"), not something this compile signal
# needs to duplicate.
#
# Two things confirmed the hard way on the first few real runs, not assumed:
#
# 1. windows/global.json pins the SDK `dotnet` resolves to 8.0.x (windows-latest
#    has more than one SDK installed, e.g. a preinstalled 10.x alongside
#    whatever actions/setup-dotnet adds, and without a pin `dotnet` picks the
#    latest one found). working-directory: windows is what makes it actually
#    get discovered — SDK resolution searches upward from cwd, never down.
#
# 2. That pin alone did NOT fix Windows App SDK's PRI-resource-generation step
#    (MrtCore.PriGen.targets) failing to load Microsoft.Build.Packaging.Pri.
#    Tasks.dll — the error persisted verbatim even once the log confirmed the
#    pinned 8.0.x SDK was the one actually being used. That assembly is a
#    Visual-Studio-installed piece, not something a bare `dotnet-install`-style
#    SDK ships; this is a known, longstanding Windows App SDK limitation
#    (microsoft/WindowsAppSDK#3939, #4889), not anything specific to this repo.
#    The documented fix is <EnableMsixTooling>true</EnableMsixTooling> in the
#    csproj (added there) — but multiple real reports show that property alone
#    doesn't reliably satisfy `dotnet build` and that `msbuild` succeeds where
#    `dotnet build` doesn't, so the build step below uses actual `msbuild` via
#    the VS toolchain already on this runner image (confirmed present in the
#    job log: "windows-2025-vs2026"), not the .NET SDK's own build front end.
name: Windows build

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: microsoft/setup-msbuild@v2

      - name: Build WinUI app (Release, win-x64, msbuild /restore)
        run: msbuild PUPSISPortal.App/PUPSISPortal.App.csproj /restore /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /m

      - name: Run Core + Tests (sanity check the portable layer, native to this platform)
        run: dotnet test PUPSISPortal.slnx -c Release
