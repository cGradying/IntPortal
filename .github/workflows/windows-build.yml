# Compiles the WinUI 3 Windows port (windows/PUPSISPortal.App) on a real
# Windows runner. This is a compile-only forcing-function, not a full CI
# pipeline: the app has never been built outside a mac session where WinUI's
# XAML compiler can't run, so this workflow's job is to turn that "unverified"
# into a visible green/red signal without hand-building on a local machine
# every round. It doesn't run the app or touch the live SIS — see
# windows/README.md "Building the WinUI app" for the runtime-verification
# steps that still need a real Windows box + a real account.
#
# Only win-x64 is built here; win-arm64 is a separate RID publish for release
# time (windows/README.md "Packaging"), not something this compile signal
# needs to duplicate.
#
# windows-latest ships more than one .NET SDK preinstalled (observed:
# 10.0.302 alongside whatever actions/setup-dotnet adds), and Windows SDK
# resolution isn't isolated per-install the way it is on mac/Linux runners —
# absent a pin, `dotnet` picks the latest one found, which broke Windows App
# SDK's PRI-resource-generation task (it looked for a task assembly under
# that SDK's own AppxPackage folder and came up empty). windows/global.json
# pins the SDK to 8.0.x; running with working-directory: windows is what
# makes `dotnet` actually discover it (its search walks up from cwd, never
# down into subdirectories).
name: Windows build

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore PUPSISPortal.App/PUPSISPortal.App.csproj

      - name: Build WinUI app (Release, win-x64)
        run: dotnet build PUPSISPortal.App/PUPSISPortal.App.csproj -c Release -r win-x64 --no-restore

      - name: Run Core + Tests (sanity check the portable layer, native to this platform)
        run: dotnet test PUPSISPortal.slnx -c Release
