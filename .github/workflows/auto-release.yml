# Auto-tags a new release on every merge to main, so cutting a release stops
# being a manual `git tag && git push` step. This job only computes the next
# version and pushes the tag as a record; the `release` job below calls
# mac-release.yml directly as a reusable workflow (`workflow_call`) with that
# tag, rather than relying on the tag push itself to trigger it.
#
# That indirection is required, not stylistic: a tag pushed using the
# built-in GITHUB_TOKEN deliberately does NOT trigger another workflow's
# `on: push` — GitHub's own anti-recursion rule. Confirmed the hard way: the
# first real run here tagged v1.5.1 and mac-release.yml silently never
# started. `workflow_call` sidesteps it entirely, since it's not a second
# independently-triggered event at all.
#
# Tests run here BEFORE the tag is created — a failing build should never get
# tagged in the first place, even though mac-release.yml would also refuse to
# release it. A dangling tag with no release attached is worse than no tag.
#
# Skip a release for one commit by writing that exact bracketed phrase (not
# quoted here on purpose — quoting it in a commit message trips the check on
# itself, confirmed the hard way) anywhere in the message — e.g. a CI-only
# tweak or a docs fix that ships no app change. An empty commit doesn't
# trigger this workflow at all (paths-ignore skips a push with zero changed
# files), so testing this needs a real diff, not `--allow-empty`.
name: Auto release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: write

jobs:
  tag:
    runs-on: macos-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full tag history to compute the next version

      - name: Run tests
        run: swift test

      - name: Compute next version and tag
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_TAG="$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)"
          if [ -z "$LAST_TAG" ]; then
            NEXT="v0.1.0"
          else
            VERSION="${LAST_TAG#v}"
            MAJOR="${VERSION%%.*}"
            REST="${VERSION#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            NEXT="v$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "Tagging $NEXT"
          git tag -a "$NEXT" -m "$NEXT"
          git push origin "$NEXT"
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    uses: ./.github/workflows/mac-release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
