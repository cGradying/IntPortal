name: Site
on:
  pull_request:
    paths: ["site/**", "src/lib/**", "PRIVACY.md", "CHANGELOG.md", "docs/specs/README.md", "pnpm-lock.yaml", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["site/**", "src/lib/**", "PRIVACY.md", "CHANGELOG.md", "docs/specs/README.md"]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish to GitHub Pages (Cloudflare Pages publishes on every push to main)
        type: boolean
        default: false

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: site
        run: pnpm check && pnpm test && pnpm build && node scripts/check-build.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/build

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  # The site lives at intportal.pages.dev. Every push to main that touches it
  # publishes the build there; PRs only build. The token is a Cloudflare API token
  # limited to Pages (repo secret CLOUDFLARE_API_TOKEN); the account id isn't secret.
  cloudflare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
      - run: mkdir site && tar -xf artifact.tar -C site
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: pages deploy site --project-name=intportal --branch=main --commit-dirty=true
