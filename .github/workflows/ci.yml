name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Runs on main are never cancelled, so every merge gets its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI keeps the build cache in target/, where rust-cache saves it.
env:
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/target

# Both jobs always run, so branch protection can require them.
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # pnpm build compiles the landing's tile portal to WebAssembly.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - run: node scripts/commands-check.mjs
      - run: node scripts/style-lint.mjs
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tauri system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The shell embeds the web build, so it needs build/ to exist.
      - run: mkdir -p build
      - run: cargo test -p intportal-core -p intportal -p intportal-tiles -p intportal-web -p s0-sis-http
      # The browser demo's core (spec 052) must keep building without SQLCipher or the network.
      - run: cargo build -p intportal-web --target wasm32-unknown-unknown --release
      # The test build generates the ACL manifest this compares capabilities against.
      - run: node scripts/commands-check.mjs
      - run: cargo clippy -p intportal-core -p intportal -p intportal-tiles -p intportal-web -p s0-sis-http --all-targets -- -D warnings
