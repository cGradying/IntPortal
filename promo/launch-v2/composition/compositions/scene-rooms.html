<!doctype html>
<html>
<head><meta charset="UTF-8" /></head>
<body>
<template>
<style>
  @font-face { font-family: "Pixelify Sans"; src: url(assets/fonts/PixelifySans.ttf) format("truetype"); font-weight: 400 700; }
  @font-face { font-family: "Source Sans 3"; src: url(assets/fonts/SourceSans3.ttf) format("truetype"); font-weight: 200 900; }
  @font-face { font-family: "Montserrat"; src: url(assets/fonts/Montserrat.ttf) format("truetype"); font-weight: 100 900; }
  #root { position: absolute; inset: 0; overflow: hidden; font-family: "Pixelify Sans", monospace; --rg: #F2EDEC; --ra: #7A1128; --ri: #140608; --rd: rgba(122,17,40,.09); }
  #rm-bgwrap { position: absolute; inset: 0; }
  #rm-bg { position: absolute; inset: 0; background: var(--rg); }
  #rm-dots { position: absolute; inset: 0; background: radial-gradient(var(--rd) 2.4px, transparent 3px) 0 0 / 26px 26px; }
  #rm-glow { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 55% at 50% 78%, color-mix(in srgb, var(--ra) 30%, transparent), transparent 70%); }
  #rm-cam { position: absolute; inset: 0; }
  #rm-stage { position: absolute; inset: 0; perspective: 2000px; perspective-origin: 50% 54%; }
  #rm-ring { position: absolute; left: 960px; top: 668px; width: 0; height: 0; transform-style: preserve-3d; }
  .rm-item { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
  .rm-dev { position: absolute; transform-origin: 50% 50%; backface-visibility: hidden; -webkit-backface-visibility: hidden; filter: drop-shadow(0 34px 34px rgba(0,0,0,.42)); }
  .rm-dev .mac, .rm-dev .phone { left: 0; top: 0; }
  #rm-title { position: absolute; left: 92px; top: 44px; font: 700 96px/1 "Pixelify Sans"; color: var(--ri); white-space: nowrap; opacity: 0; text-shadow: 0 6px 0 color-mix(in srgb, var(--rg) 55%, #000); }
  #rm-name { position: absolute; right: 92px; top: 44px; font: 700 96px/1 "Pixelify Sans"; color: var(--ra); white-space: nowrap; text-align: right; text-shadow: 0 6px 0 color-mix(in srgb, var(--rg) 55%, #000); }
  #rm-sw { position: absolute; right: 92px; top: 158px; display: flex; gap: 12px; }
  #rm-sw i { display: block; width: 52px; height: 52px; box-shadow: 0 0 0 4px var(--ri); }
  #rm-isko { position: absolute; left: 56px; top: 800px; width: 168px; height: 240px; opacity: 0; filter: drop-shadow(0 8px 0 rgba(0,0,0,.28)); }
  #rm-isko svg { width: 100%; height: 100%; }
  .rm-z { position: absolute; font: 700 44px "Pixelify Sans"; color: #F5B227; text-shadow: 0 4px 0 rgba(0,0,0,.5); opacity: 0; }
  #rm-pulse { position: absolute; inset: 0; background: var(--ra); opacity: 0; pointer-events: none; }
  #rm-flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #FFFDF4 0%, #F6E7B0 46%, #C9A227 100%); opacity: 1; pointer-events: none; }
  #rm-fx { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; image-rendering: pixelated; pointer-events: none; }
</style>

<div id="root" data-composition-id="scene-rooms" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow data-width="1920" data-height="1080">
  <div id="rm-bgwrap"><div id="rm-bg"></div><div id="rm-dots"></div><div id="rm-glow"></div></div>
  <div id="rm-cam"><div id="rm-stage"><div id="rm-ring"></div></div></div>
  <div id="rm-title">PICK YOUR ROOM.</div>
  <div id="rm-name"><span id="rm-nm"></span></div>
  <div id="rm-sw"><i></i><i></i><i></i><i></i></div>
  <div id="rm-isko"></div>
  <span class="rm-z" id="rm-z1">z</span><span class="rm-z" id="rm-z2">Z</span><span class="rm-z" id="rm-z3">Z</span>
  <canvas id="rm-fx" width="240" height="135"></canvas>
  <div id="rm-pulse"></div>
  <div id="rm-flash"></div>
</div>

<script>
(function () {
  const IP = window.IP, UI = IP.ui, FX = IP.fx;
  const ID = "scene-rooms", A = 22.3;
  const L = (abs) => abs - A;
  const $ = (id) => document.getElementById(id);
  const root = $("root"), ringEl = $("rm-ring");
  IP.cfixEl($("rm-title"));
  const R = 1150;
  const DEV = [
    { id: "pupMaroon", name: "PUP MAROON", kind: "mac" },
    { id: "night", name: "NIGHT", kind: "phone", screen: "today" },
    { id: "astraMoon", name: "ASTRA MOON", kind: "phone", screen: "grades" },
    { id: "sakura", name: "SAKURA", kind: "mac" },
    { id: "matrix", name: "MATRIX", kind: "phone", screen: "schedule" },
    { id: "dracula", name: "DRACULA", kind: "phone", screen: "study" },
    { id: "nord", name: "NORD", kind: "mac" },
    { id: "tokyoNight", name: "TOKYO NIGHT", kind: "phone", screen: "you" },
  ];
  DEV.forEach((d, k) => {
    const item = document.createElement("div"); item.className = "rm-item"; item.style.transform = `rotateY(${k * 45}deg) translateZ(${R}px)`;
    const dev = document.createElement("div"); dev.className = "rm-dev";
    if (d.kind === "mac") { dev.style.cssText = "left:-800px;top:-500px;width:1600px;height:1000px;transform:scale(.7)"; dev.innerHTML = UI.mac({ room: d.id }); IP.applyRoom(dev.firstElementChild, d.id); }
    else { dev.style.cssText = "left:-201px;top:-437px;width:402px;height:874px;transform:scale(.94)"; dev.innerHTML = UI.phone({ room: d.id, screen: d.screen, flat: true, time: "7:18", island: { label: "IntPortal", short: "" } }); IP.applyRoom(dev.firstElementChild, d.id); }
    item.appendChild(dev); ringEl.appendChild(item);
  });
  const nm = $("rm-nm"), sw = [...$("rm-sw").children];
  $("rm-isko").innerHTML = IP.spriteSVG(IP.ISKO.sleepy, IP.ISKO_COLORS);

  const T_ = DEV.map((_, k) => IP.cue("room" + k));
  const tl = gsap.timeline({ paused: true });
  // flash out of the suck-in, ring spins into place
  tl.fromTo("#rm-flash", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power2.out" }, L(22.42));
  tl.fromTo(ringEl, { z: -R - 200, rotationY: 150, y: 60 }, { z: -R + 60, rotationY: 0, y: 0, duration: 0.55, ease: "power4.out" }, L(22.3));
  for (let k = 1; k < DEV.length; k++) tl.to(ringEl, { rotationY: -45 * k, duration: 0.3, ease: "power3.out" }, L(T_[k]) - 0.2);
  tl.to(ringEl, { z: -R + 190, duration: 3.0, ease: "sine.inOut" }, L(22.85));
  tl.fromTo("#rm-cam", { rotationX: 7 }, { rotationX: 2, duration: 3.0, ease: "sine.inOut" }, L(22.4));
  // title + per-beat name stamp + pulse
  tl.fromTo("#rm-title", { opacity: 0, x: -60, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, x: 0, clipPath: "inset(0 0% 0 0)", duration: 0.3, ease: "steps(7)" }, L(22.55));
  T_.forEach((ts, k) => {
    tl.fromTo("#rm-name", { scale: 2.2, opacity: 0, rotation: 5 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.15, ease: "power3.in", immediateRender: false }, L(ts) - 0.15);
    tl.fromTo("#rm-pulse", { opacity: 0.32 }, { opacity: 0, duration: 0.14, ease: "power1.out", immediateRender: false }, L(ts));
    tl.fromTo("#rm-sw i", { scale: 0.2 }, { scale: 1, duration: 0.2, ease: "back.out(2.4)", stagger: 0.04, immediateRender: false }, L(ts));
  });
  // Isko dozes off in Night, wakes for Sakura
  tl.fromTo("#rm-isko", { opacity: 0, y: 90 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(1.8)", immediateRender: false }, L(T_[1]) - 0.1);
  tl.to("#rm-isko", { opacity: 0, y: 90, duration: 0.22, ease: "power2.in" }, L(T_[4]) - 0.05);
  // exit: ring shoots back, background dissolves into the night campus
  tl.to(ringEl, { z: -R - 2600, duration: 0.42, ease: "power3.in" }, L(25.25));
  tl.to("#rm-title, #rm-name, #rm-sw", { opacity: 0, duration: 0.2 }, L(25.3));
  tl.to("#rm-bgwrap", { opacity: 0, duration: 0.3, ease: "none" }, L(25.42));

  // ---- dynamic (pure function of time): room index -> palette vars, name, swatches, campus canvas, sleepy z's ----
  const fx = $("rm-fx").getContext("2d");
  let lastK = -2, lastNm = -2;
  function dyn(t) {
    const abs = t + A;
    let k = -1; for (let i = 0; i < T_.length; i++) if (abs >= T_[i] - 1e-6) k = i;
    const kk = Math.max(0, k);
    if (kk !== lastK) {
      const r = IP.room(DEV[kk].id);
      root.style.setProperty("--rg", r["--ground"]); root.style.setProperty("--ra", r["--gold"]); root.style.setProperty("--ri", r["--ink"]); root.style.setProperty("--rd", r["--dot"]);
      [r["--ground"], r["--card"], r["--gold"], r["--ink"]].forEach((c, i) => (sw[i].style.background = c));
      lastK = kk;
    }
    let nk = 0; for (let i = 0; i < T_.length; i++) if (abs >= T_[i] - 0.15) nk = i;
    if (nk !== lastNm) { nm.innerHTML = IP.cfix(DEV[nk].name); lastNm = nk; }
    UI.paintCampus(ringEl, abs * 1000, IP.hourAt(abs), "COMP 20083");
    // sleepy z's
    [1, 2, 3].forEach((n) => {
      const el = $("rm-z" + n), u = ((abs * 1.1 + n * 0.33) % 1);
      el.style.opacity = (abs > T_[1] && abs < T_[4] - 0.1) ? (u < 0.85 ? 1 - u * 0.6 : 0) : 0;
      el.style.left = (190 + n * 26 + Math.floor(u * 4) * 5) + "px"; el.style.top = (790 - Math.floor(u * 6) * 22 - n * 24) + "px";
      el.style.fontSize = (34 + n * 12) + "px";
    });
    // pixel burst on each snap
    fx.clearRect(0, 0, 240, 135);
    T_.forEach((ts, i) => FX.burst(fx, 120, 84, abs - ts, { n: 9, seed: 60 + i, speed: 70, gravity: 60, life: 0.4, spread: Math.PI * 2, colors: [IP.room(DEV[i].id)["--gold"], "#FAEBB3", IP.room(DEV[i].id)["--ink"]] }));
  }
  const drv = { t: 0 };
  tl.to(drv, { t: 3.4, duration: 3.4, ease: "none", onUpdate: function () { dyn(tl.time()); } }, 0);
  dyn(0);
  window.__timelines[ID] = tl;
})();
</script>
</template>
</body>
</html>
