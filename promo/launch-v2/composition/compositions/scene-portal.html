<!doctype html>
<html>
<head><meta charset="UTF-8" /></head>
<body>
<template>
<style>
  @font-face { font-family: "Pixelify Sans"; src: url(assets/fonts/PixelifySans.ttf) format("truetype"); font-weight: 400 700; }
  @font-face { font-family: "Source Sans 3"; src: url(assets/fonts/SourceSans3.ttf) format("truetype"); font-weight: 200 900; }
  @font-face { font-family: "Montserrat"; src: url(assets/fonts/Montserrat.ttf) format("truetype"); font-weight: 100 900; }
  #root { position: absolute; inset: 0; overflow: hidden; background: #07050A; font-family: "Pixelify Sans", monospace; color: #F7ECEC; }
  #p-gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; image-rendering: pixelated; }
  #p-brand { position: absolute; left: 96px; top: 74px; }
  #p-brand b { display: block; font: 700 58px/1 "Pixelify Sans"; letter-spacing: .01em; color: #F5B227; }
  #p-brand b i { font-style: normal; color: #FFF5DC; }
  #p-brand span { display: block; margin-top: 8px; font: 500 28px "Source Sans 3"; color: rgba(244,236,216,.62); }
  .p-kw { position: absolute; left: 92px; font: 700 150px/0.98 "Pixelify Sans"; letter-spacing: -.005em; white-space: nowrap;
          text-shadow: 0 7px 0 #34203F, 0 14px 0 #170B1A, 0 21px 0 rgba(0,0,0,.5); }
  #p-w1 { top: 250px; color: #F7ECEC; opacity: 0; }
  #p-w2 { top: 420px; color: #F5B227; opacity: 0; }
  #p-w3 { top: 330px; font-size: 176px; color: #F7ECEC; opacity: 0; }
  #p-w3 i { font-style: normal; color: #F5B227; }
  #p-bub { position: absolute; left: 0; top: 0; width: 520px; padding: 20px 26px 22px; background: #F7ECEC; color: #1b1406;
           font: 700 54px/1.1 "Source Sans 3"; box-shadow: 0 -6px 0 0 #F7ECEC, 0 6px 0 0 #F7ECEC, -6px 0 0 0 #F7ECEC, 6px 0 0 0 #F7ECEC, 8px 14px 0 0 rgba(0,0,0,.45); opacity: 0; }
  #p-bub:after { content: ""; position: absolute; left: 60px; bottom: -30px; width: 24px; height: 24px; background: #F7ECEC; box-shadow: 12px 12px 0 0 #F7ECEC, -0px 6px 0 0 #F7ECEC; }
  #p-bub small { display: block; font: 600 22px "Pixelify Sans"; letter-spacing: .12em; color: #7a1128; margin-bottom: 6px; }
  #p-flash { position: absolute; inset: 0; background: radial-gradient(circle at 62% 48%, #FFFDF4 0%, #F6E7B0 38%, #C9A227 78%, #6D0E1F 120%); opacity: 0; }
  #p-fx { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; image-rendering: pixelated; pointer-events: none; }
  #p-vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(7,5,10,0) 55%, rgba(7,5,10,.78) 100%); pointer-events: none; }
</style>

<div id="root" data-composition-id="scene-portal" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow data-width="1920" data-height="1080">
  <canvas id="p-gl" width="640" height="360"></canvas>
  <canvas id="p-fx" width="240" height="135"></canvas>
  <div id="p-vig"></div>
  <div id="p-brand"><b>Student <i>IntPortal</i></b><span>PUP SIS, in your pocket</span></div>
  <div class="p-kw" id="p-w1">YOUR CAMPUS.</div>
  <div class="p-kw" id="p-w2">IN YOUR<br>POCKET.</div>
  <div class="p-kw" id="p-w3">MEET <i>ISKO.</i></div>
  <div id="p-bub" data-full="Hi, I'm Isko!"><small>ISKO</small><span id="p-bubt"></span></div>
  <div id="p-flash"></div>
</div>

<script>
(function () {
  const IP = window.IP, T = window.THREE;
  const ID = "scene-portal";
  ["p-w1", "p-w2"].forEach((id) => IP.cfixEl(document.getElementById(id)));
  const W = 640, H = 360, P = 4.6;
  const cv = document.getElementById("p-gl");
  const world = IP.createWorld(cv, W, H, { fov: 32 });
  const { scene, camera } = world;

  // --- glow (dithered, additive) ---
  const gc = document.createElement("canvas"); gc.width = gc.height = 96;
  (function () {
    const g = gc.getContext("2d"); const img = g.createImageData(96, 96);
    for (let y = 0; y < 96; y++) for (let x = 0; x < 96; x++) {
      const d = Math.hypot(x - 47.5, y - 47.5) / 47.5;
      const a = Math.max(0, 1 - d); const v = a * a * 4 + IP.BAYER[y & 3][x & 3] / 16 - 0.5;
      const k = Math.max(0, Math.min(3, Math.floor(v))) / 3;
      const i = (y * 96 + x) * 4; img.data[i] = 201; img.data[i + 1] = 120; img.data[i + 2] = 40; img.data[i + 3] = k * 95;
    }
    g.putImageData(img, 0, 0);
  })();
  const gtex = new T.CanvasTexture(gc); gtex.magFilter = T.NearestFilter; gtex.minFilter = T.NearestFilter;
  const glow = new T.Mesh(new T.PlaneGeometry(26, 26), new T.MeshBasicMaterial({ map: gtex, transparent: true, blending: T.AdditiveBlending, depthWrite: false }));
  glow.position.set(P, 0, -1.6); scene.add(glow);

  const portal = IP.makePortal({ seed: 5 }); portal.position.set(P, 0, 0); scene.add(portal);
  const plat = IP.makePlatform(5, 1.9); plat.position.set(P, -4.0, 1.6); scene.add(plat);
  const motes = IP.makeMotes(170, [48, 28, 26], 9); motes.position.set(P, 0, -2); scene.add(motes);
  const isko = IP.makeIsko(); isko.scale.setScalar(0.17); scene.add(isko);

  // --- camera tracks ---
  const camX = IP.track([[0, -3.0], [3.2, -0.4, "io"], [4.6, 0.9, "out"], [5.2, 1.2, "io"], [6.3, P, "in"]]);
  const camY = IP.track([[0, 1.9], [3.2, 1.2, "io"], [4.6, 0.7, "out"], [5.2, 0.6, "io"], [6.3, -0.6, "in"]]);
  const camZ = IP.track([[0, 28], [3.2, 23.5, "io"], [4.6, 19.5, "out"], [5.2, 18.6, "io"], [6.3, 0.9, "in"]]);
  const lkX = IP.track([[0, -0.6], [3.2, 0.4, "io"], [4.6, 1.3, "out"], [5.2, 1.5, "io"], [6.3, P, "in"]]);
  const lkY = IP.track([[0, -0.2], [4.6, -0.4, "io"], [6.3, -0.5, "io"]]);
  const lkZ = IP.track([[0, 0], [5.2, 0, "io"], [6.3, -6, "in"]]);
  const fov = IP.track([[0, 32], [5.2, 32, "io"], [6.3, 84, "in"]]);
  const ign = IP.cue("ignite");
  const swirlLit = (t) => IP.steps((t - ign) / 0.5, 6);
  const blk = []; for (let i = 0; i < 24; i++) blk.push(IP.cue("blk" + i));

  // Isko choreography
  const RUN0 = 2.4, ARR = 3.2, WAVE0 = 4.0, WAVE1 = 4.85, JUMP0 = 5.05, GONE = 5.75;
  const groundY = -4.0 + 1.7;
  function iskoUpdate(t) {
    if (t < RUN0 - 0.05 || t > GONE) { isko.visible = false; return; }
    isko.visible = true;
    let x, y = groundY, z = 2.7, ry = 0, mode = "idle", pp = {}, sc = 0.17;
    if (t < ARR) {                                   // runs in from the left
      const u = IP.step(t, RUN0, ARR);
      x = IP.lerp(-15.5, P - 0.7, IP.E.out(u)); ry = Math.PI * 0.5; mode = "run";
    } else if (t < WAVE0) {                          // stops, turns to camera
      x = P - 0.7; const u = IP.step(t, ARR, ARR + 0.22); ry = Math.PI * 0.5 * (1 - IP.E.out(u)); mode = "idle";
      y += Math.max(0, Math.sin(Math.PI * IP.step(t, ARR, ARR + 0.22))) * 0.5;
    } else if (t < WAVE1) { x = P - 0.7; mode = "wave"; }
    else if (t < JUMP0) { x = P - 0.7; mode = "idle"; }
    else {                                           // jumps into the swirl
      const q = IP.step(t, JUMP0, GONE);
      x = IP.lerp(P - 0.7, P, IP.E.io(q)); z = IP.lerp(2.7, 0.3, IP.E.in(q)); y += Math.sin(Math.PI * Math.min(1, q * 1.15)) * 2.6;
      mode = "jump"; pp = { q: Math.min(1, q * 1.1), h: 0 }; sc = 0.17 * (1 - 0.55 * IP.E.in(IP.step(t, JUMP0 + 0.4, GONE)));
      ry = -0.3 * q;
    }
    isko.position.set(x, y, z); isko.rotation.y = ry; isko.scale.setScalar(sc);
    isko.pose(mode, t, pp);
  }

  // dive: pixels grow (render resolution steps down)
  function resAt(t) {
    const p = IP.step(t, 5.45, 6.35);
    const k = p < 0.02 ? 1 : p < 0.3 ? 2 : p < 0.5 ? 4 : p < 0.68 ? 8 : p < 0.82 ? 16 : 32;
    return [W / k, H / k];
  }

  world.update = function (t) {
    // camera
    camera.position.set(camX(t), camY(t), camZ(t));
    camera.lookAt(lkX(t), lkY(t), lkZ(t));
    if (Math.abs(camera.fov - fov(t)) > 1e-3) { camera.fov = fov(t); camera.updateProjectionMatrix(); }
    const [rw, rh] = resAt(t); world.setRes(rw, rh);
    // portal blocks slam in
    portal.blocks.forEach((b, i) => {
      const tl = blk[i], fall = 0.3;
      if (t < tl - fall) { b.g.visible = false; return; }
      b.g.visible = true;
      const u = Math.min(1, (t - (tl - fall)) / fall);
      const dy = 14 * (1 - u * u);
      const settle = t > tl ? -0.14 * Math.max(0, 1 - (t - tl) / 0.09) : 0;
      b.g.position.set(b.home.x, b.home.y + dy + settle, b.home.z);
    });
    portal.uni.t.value = t; portal.uni.lit.value = swirlLit(t);
    portal.swirl.visible = t > blk[23] - 0.1;
    plat.scale.y = IP.E.out(IP.step(t, 0.02, 0.6)); plat.visible = t > 0.02;
    glow.material.opacity = IP.clamp(swirlLit(t) * 0.9 + IP.step(t, 0.3, 1.5) * 0.15) * (1 - IP.step(t, 5.6, 6.2) * 0.3);
    motes.userData.step(t);
    iskoUpdate(t);
  };

  // --- DOM: words, bubble, flash ---
  const tl = gsap.timeline({ paused: true });
  const w1 = document.getElementById("p-w1"), w2 = document.getElementById("p-w2"), w3 = document.getElementById("p-w3");
  const bub = document.getElementById("p-bub"), bubt = document.getElementById("p-bubt"), flash = document.getElementById("p-flash");
  const brand = document.getElementById("p-brand");
  const reveal = (el, t0, dur = 0.26) => tl.fromTo(el, { clipPath: "inset(0 100% 0 0)", x: -80, opacity: 0 }, { clipPath: "inset(0 0% 0 0)", x: 0, opacity: 1, duration: dur, ease: "steps(6)" }, t0);
  const exit = (el, t0, dur = 0.22) => tl.to(el, { clipPath: "inset(0 0% 0 100%)", x: 90, opacity: 0, duration: dur, ease: "steps(5)" }, t0);
  tl.fromTo(brand, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25);
  reveal(w1, IP.cue("word1"));
  reveal(w2, IP.cue("word2"));
  exit(w1, 3.05); exit(w2, 3.05);
  reveal(w3, 3.3, 0.3); exit(w3, 4.3);
  // bubble (follows Isko's head in screen space)
  const blipT = IP.cue("b1");
  const sched = IP.typeSchedule(bub.dataset.full, blipT, 1.0);
  tl.fromTo(bub, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2.5)" }, blipT - 0.08);
  tl.to(bub, { opacity: 0, scale: 0.6, duration: 0.15, ease: "power2.in" }, 4.95);
  bubt.dataset.full = bub.dataset.full;
  IP.driveText(tl, bubt, sched, blipT + 1.3);
  // flash out of the dive (cue drop = 6.4)
  tl.fromTo(flash, { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "power2.in" }, 6.16);
  tl.to(brand, { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" }, 3.0);

  // single driver: render the world from local time on every seek
  const drv = { t: 0 };
  const proj = new T.Vector3();
  const fxg = document.getElementById("p-fx").getContext("2d");
  tl.to(drv, {
    t: 6.4, duration: 6.4, ease: "none",
    onUpdate: function () {
      const t = tl.time();
      world.render(t);
      // opening impact (hit0): pixel ring + debris from the platform, so frame 0 already has a pulse
      fxg.clearRect(0, 0, 240, 135);
      IP.fx.ring(fxg, 149, 96, t, { r: 96, dur: 0.7, color: "#FAEBB3", squash: 0.45 });
      IP.fx.ring(fxg, 149, 96, t - 0.06, { r: 60, dur: 0.6, color: "#F5B227", squash: 0.45 });
      IP.fx.burst(fxg, 149, 92, t, { n: 44, seed: 3, speed: 62, gravity: 70, life: 0.9, spread: Math.PI * 1.3, angle0: -Math.PI / 2, colors: ["#F5B227", "#FAEBB3", "#941C30", "#CCA128"] });
      // bubble follows the head
      if (isko.visible && t > blipT - 0.1 && t < 5.0) {
        proj.set(isko.position.x - 1.3, isko.position.y + 3.3, isko.position.z);
        proj.project(camera);
        const px = (proj.x * 0.5 + 0.5) * 1920, py = (-proj.y * 0.5 + 0.5) * 1080;
        bub.style.left = Math.round(px - 480) + "px"; bub.style.top = Math.round(py - 250) + "px";
      }
    },
  }, 0);
  world.render(0);
  window.__timelines[ID] = tl;
})();
</script>
</template>
</body>
</html>
