<!doctype html>
<html>
<head><meta charset="UTF-8" /></head>
<body>
<template>
<style>
  @font-face { font-family: "Pixelify Sans"; src: url(assets/fonts/PixelifySans.ttf) format("truetype"); font-weight: 400 700; }
  @font-face { font-family: "Source Sans 3"; src: url(assets/fonts/SourceSans3.ttf) format("truetype"); font-weight: 200 900; }
  @font-face { font-family: "Montserrat"; src: url(assets/fonts/Montserrat.ttf) format("truetype"); font-weight: 100 900; }
  #root { position: absolute; inset: 0; overflow: hidden; font-family: "Pixelify Sans", monospace; color: #F7ECEC; }
  #cp-scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,5,10,.7) 0%, rgba(7,5,10,0) 34%), radial-gradient(ellipse at 50% 50%, rgba(7,5,10,0) 55%, rgba(7,5,10,.55) 100%); }
  #cp-gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; image-rendering: pixelated; }
  .cp-kw { position: absolute; left: 92px; top: 52px; font: 700 108px/1 "Pixelify Sans"; white-space: nowrap; opacity: 0;
           text-shadow: 0 6px 0 #34203F, 0 12px 0 #170B1A, 0 18px 0 rgba(0,0,0,.45); }
  .cp-kw i { font-style: normal; color: #F5B227; }
  .cp-lab { position: absolute; left: 0; top: 0; text-align: center; white-space: nowrap; opacity: 0; }
  .cp-lab.pup { padding: 10px 26px 12px; background: rgba(14,14,16,.92); box-shadow: inset 0 0 0 4px #F5B227, 0 8px 0 rgba(0,0,0,.4); }
  .cp-lab.pup b { display: block; font: 700 58px/1 "Pixelify Sans"; color: #F5B227; }
  .cp-lab.pup span { display: block; margin-top: 4px; font: 600 30px "Source Sans 3"; color: #F7ECEC; }
  .cp-lab.dark b { display: inline-block; padding: 8px 18px 10px; background: rgba(14,14,16,.9); box-shadow: inset 0 0 0 3px rgba(255,255,255,.2); font: 700 30px "Montserrat", sans-serif; color: #c9c9d1; }
  #cp-fx { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; image-rendering: pixelated; pointer-events: none; }
  #cp-flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 46%, #FFFDF4 0%, #F6E7B0 40%, #C9A227 100%); opacity: 0; pointer-events: none; }
</style>

<div id="root" data-composition-id="scene-campus" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow data-width="1920" data-height="1080">
  <div id="cp-scrim"></div>
  <canvas id="cp-gl" width="480" height="270"></canvas>
  <div class="cp-lab pup" id="cp-l0"><b>PUP SIS</b><span>Sta. Mesa &middot; sis8.pup.edu.ph</span></div>
  <div class="cp-lab dark" id="cp-l1"><b>Not connected yet</b></div>
  <div class="cp-lab dark" id="cp-l9"><b>Not connected yet</b></div>
  <div class="cp-lab dark" id="cp-l2"><b>Not connected yet</b></div>
  <div class="cp-lab dark" id="cp-l8"><b>Not connected yet</b></div>
  <div class="cp-kw" id="cp-k1">STA. MESA <i>FIRST.</i></div>
  <div class="cp-kw" id="cp-k2">EVERY <i>CAMPUS</i> NEXT.</div>
  <canvas id="cp-fx" width="240" height="135"></canvas>
  <div id="cp-flash"></div>
</div>

<script>
(function () {
  const IP = window.IP, T = window.THREE, FX = IP.fx;
  const ID = "scene-campus", A = 25.5;
  const L = (abs) => abs - A;
  const $ = (id) => document.getElementById(id);
  IP.cfixEl($("cp-k2"));

  const world = IP.createWorld($("cp-gl"), 480, 270, { fov: 32, transparent: true });
  const { scene, camera } = world;
  const NP = 10, RR = 14;
  const ring = new T.Group(); scene.add(ring);
  const portals = [];
  for (let i = 0; i < NP; i++) {
    const p = IP.makePortal({ seed: 20 + i }); const a = (i / NP) * Math.PI * 2;
    p.position.set(Math.sin(a) * RR, 4, Math.cos(a) * RR); p.rotation.y = a; ring.add(p); portals.push(p);
  }
  const plat = IP.makePlatform(3, 1.9); plat.position.set(-1.2, -0.4, RR + 3.4); scene.add(plat);
  const isko = IP.makeIsko(); isko.scale.setScalar(0.2); scene.add(isko);
  const isX = IP.track([[0, -24], [0.55, -24], [1.3, -5.4, "out"]]);
  const motes = IP.makeMotes(150, [64, 30, 44], 21); motes.position.set(0, 6, 0); scene.add(motes);

  // camera: close on the lit portal, pull back to the hub, then push toward the riser
  const camZ = IP.track([[0, 31.5], [0.1, 31.5], [1.6, 41, "out"], [3.3, 36, "io"]]);
  const camY = IP.track([[0, 4.1], [0.1, 4.1], [1.6, 7.2, "out"], [3.3, 6.2, "io"]]);
  const lookY = IP.track([[0, 3.9], [1.6, 3.6, "io"], [3.3, 3.8, "io"]]);
  const ringRot = IP.track([[0, 0], [3.4, -0.07, "lin"]]);
  const FLK = [[1, IP.cue("flicker0")], [9, IP.cue("flicker1")], [2, IP.cue("flicker2")], [8, IP.cue("campus_riser_whoosh") + 0.05]];
  const RISE0 = IP.cue("campus_riser_whoosh");
  const litOf = (i, abs) => {
    if (i === 0) return 1;
    let v = 0;
    FLK.forEach(([j, tc]) => { if (j === i) { const u = (abs - tc) / 0.3; if (u >= 0 && u <= 1) v = Math.max(v, 0.95 * Math.sin(Math.PI * Math.min(1, u * 1.15))); } });
    if (abs > RISE0) v = Math.max(v, 0.55 * IP.clamp((abs - RISE0) / 0.5) * (i === 5 || i === 4 || i === 3 || i === 6 || i === 7 ? 0.9 : 1));
    return v;
  };
  world.update = function (t) {
    const abs = t + A;
    camera.position.set(Math.sin(t * 0.5) * 1.2, camY(t), camZ(t));
    camera.lookAt(0, lookY(t), 4);
    ring.rotation.y = ringRot(t) - Math.max(0, abs - RISE0) * Math.max(0, abs - RISE0) * 0.55;
    portals.forEach((p, i) => {
      const lv = litOf(i, abs);
      p.uni.t.value = abs * (i === 0 ? 1 : 0.7 + i * 0.03); p.uni.lit.value = lv; p.swirl.visible = true;
      p.blocks.forEach((b) => b.g.scale.setScalar(1));
    });
    const ix = isX(t); const moving = t > 0.55 && t < 1.3;
    isko.pose(moving ? "run" : abs < 27.5 ? "idle" : "wave", abs, { rate: 13 });
    isko.position.set(ix, 2.0, RR + 3.4); isko.rotation.y = moving ? 1.35 : 0.35; isko.visible = t > 0.5;
    motes.userData.step(abs);
    plat.rotation.y = 0;
  };

  // label placement: project world positions each frame (pure function of t)
  const V = new T.Vector3();
  function place(el, i, dy, abs, t) {
    const a = (i / NP) * Math.PI * 2 + ring.rotation.y;
    V.set(Math.sin(a) * RR, dy, Math.cos(a) * RR); camera.updateMatrixWorld(); V.project(camera);
    const x = (V.x * 0.5 + 0.5) * 1920, y = Math.min(1000, (1 - (V.y * 0.5 + 0.5)) * 1080);
    el.style.left = x + "px"; el.style.top = Math.min(y, 930) + "px";
  }

  // ---- timeline ----
  const tl = gsap.timeline({ paused: true });
  const kw = (el, t0, out) => {
    tl.fromTo(el, { opacity: 0, x: -70, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, x: 0, clipPath: "inset(0 0% 0 0)", duration: 0.28, ease: "steps(7)" }, L(t0));
    tl.to(el, { opacity: 0, x: 60, clipPath: "inset(0 0% 0 100%)", duration: 0.2, ease: "steps(5)" }, L(out));
  };
  kw($("cp-k1"), 25.95, 27.25); kw($("cp-k2"), 27.32, 28.72);
  tl.fromTo("#cp-l0", { opacity: 0, y: 24, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.28, ease: "back.out(2)" }, L(25.9));
  FLK.forEach(([i, tc], n) => {
    tl.fromTo("#cp-l" + i, { opacity: 0, y: 20, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.2, ease: "back.out(2)", immediateRender: false }, L(tc));
  });
  tl.fromTo("#root", { clipPath: "circle(0% at 50% 48%)" }, { clipPath: "circle(90% at 50% 48%)", duration: 0.45, ease: "power3.out" }, L(25.52));
  tl.fromTo("#cp-flash", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.in" }, L(28.6));

  gsap.set(".cp-lab", { xPercent: -50, yPercent: -50 });
  const fx = $("cp-fx").getContext("2d");
  function dyn(t) {
    const abs = t + A;
    [[0, 1.2], [1, 3.2], [9, 3.2], [2, 3.2], [8, 3.2]].forEach(([i, dy]) => place($("cp-l" + i), i, i === 0 ? -0.6 : (i === 8 || i === 2) ? 7.2 : 4.2, abs, t));
    fx.clearRect(0, 0, 240, 135);
    FLK.forEach(([i, tc]) => {
      if (i === 0) return;
      const a = (i / NP) * Math.PI * 2 + ring.rotation.y;
      V.set(Math.sin(a) * RR, 4, Math.cos(a) * RR); camera.updateMatrixWorld(); V.project(camera);
      FX.burst(fx, (V.x * 0.5 + 0.5) * 240, (1 - (V.y * 0.5 + 0.5)) * 135, abs - tc, { n: 14, seed: 70 + i, speed: 38, gravity: 20, life: 0.6, spread: Math.PI * 2, colors: ["#FAEBB3", "#CCA128", "#941C30"] });
    });
  }
  const drv = { t: 0 };
  tl.to(drv, { t: 3.28, duration: 3.28, ease: "none", onUpdate: function () { const t = tl.time(); world.render(t); dyn(t); } }, 0);
  world.render(0); dyn(0);
  window.__timelines[ID] = tl;
})();
</script>
</template>
</body>
</html>
