<!doctype html>
<html><head><meta charset="utf-8">
<style>@font-face{font-family:"GM";src:url(lib/GeistMono-Variable.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;background:transparent;overflow:hidden}</style></head>
<body>
<div id="root" data-composition-id="ascii" data-width="1040" data-height="1040" data-fps="60" data-start="0" data-duration="2.2617">
<canvas id="c" width="1040" height="1040"></canvas>
</div>
<script src="vendor/gsap.min.js"></script>
<script src="grid.js"></script>
<script type="module">
// Isko form 5: ASCII. The sprite is sampled per sprite-pixel; each beat swaps
// the glyph ramp (with a short scramble), the last beat resolves into colour.
import { B, bt, clamp, clip, hash, loadImg, spring } from "./lib/hf.js";
const img = await loadImg("lib/open.png");
await document.fonts.load('600 20px "GM"');
const ROWS = 28; // 42 sprite rows squeezed so glyph cells (15x22) keep the sprite square
const COLS = 40; // crop to Isko (sprite px 12..52)
const src = document.createElement("canvas"); src.width = COLS; src.height = ROWS;
const sx = src.getContext("2d"); sx.imageSmoothingEnabled = false; sx.drawImage(img, 48, 0, 160, 168, 0, 0, COLS, ROWS);
const px = sx.getImageData(0, 0, COLS, ROWS).data;
const cells = [];
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
  const o = (y * COLS + x) * 4, a = px[o + 3] / 255;
  if (a < 0.5) continue;
  const lum = (0.3 * px[o] + 0.59 * px[o + 1] + 0.11 * px[o + 2]) / 255;
  cells.push({ x, y, lum, col: `rgb(${px[o]},${px[o + 1]},${px[o + 2]})` });
}
const RAMPS = [" .:-=+*#%@", " 01", " ISKO", " .:-=+*#%@"];
const SCR = "!<>-_\\/[]{}=+*^?#";
const c = document.getElementById("c"), g = c.getContext("2d");
const CW = 23, CH = 33, X0 = 520 - (COLS / 2 - 0.5) * CW, Y0 = 520 - (ROWS / 2 - 0.5) * CH;
clip("ascii", 119.5, 124.4, (t) => {
  g.clearRect(0, 0, 1040, 1040);
  g.font = '600 32px "GM"'; g.textAlign = "center"; g.textBaseline = "middle";
  const b = bt(t);
  const i = clamp(Math.floor(b - 120 + 0.02), 0, 3);
  const since = t - B(120 + i);
  const reveal = clamp((t - B(119.6)) / 0.35);
  const colour = spring(t - B(123), 170, 26);
  for (const q of cells) {
    if (q.y / ROWS > reveal * 1.15) continue;
    const ramp = RAMPS[b < 120 ? 0 : i];
    const scramble = (b >= 120 && since < 0.16) || (b < 120 && t - B(119.6) < 0.35 + 0.1 - q.y * 0.008);
    let ch = ramp[1 + Math.floor((1 - q.lum) * (ramp.length - 1.001))] ?? ramp[ramp.length - 1];
    if (ramp === RAMPS[2]) ch = "ISKO"[(q.x + q.y * 3) % 4];
    if (scramble) ch = SCR[Math.floor(hash(q.x * 31 + q.y * 7 + Math.floor(t * 30)) * SCR.length)];
    g.fillStyle = colour > 0.01 ? q.col : "#fff";
    g.globalAlpha = colour > 0.01 ? 0.25 + 0.75 * colour : 0.55 + 0.45 * (1 - q.lum);
    if (colour > 0.01) { g.globalAlpha = 1; g.fillStyle = mix("#ffffff", q.col, 0.7 * colour); }
    g.fillText(ch, X0 + q.x * CW, Y0 + q.y * CH);
  }
  g.globalAlpha = 1;
});
function mix(a, b, k) {
  const A = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16));
  const Bc = b.match(/\d+/g).map(Number);
  return `rgb(${A.map((v, i) => Math.round(v + (Bc[i] - v) * k)).join(",")})`;
}
</script></body></html>
