<!doctype html>
<!-- Dev only: every campus scene at four hours, for scripts/campus-sheet.mjs. -->
<meta charset="utf-8" />
<title>Campus scenes</title>
<style>
  body { margin: 0; padding: 16px; background: #0b0710; color: #f4ecd8; font: 13px/1.3 ui-sans-serif, system-ui; }

<script type="module" src="./sheet.ts"></script>
