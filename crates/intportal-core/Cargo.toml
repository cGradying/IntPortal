[package]
name = "intportal-core"
version.workspace = true
edition = "2021"
publish = false

# The phone shells use both. The browser demo (crates/intportal-web, spec 052)
# turns them off: it has no SQLCipher and talks to no portal.
[features]
default = ["store", "net"]
store = ["dep:rusqlite", "dep:zip"]
net = ["dep:reqwest"]

[dependencies]
regex = "1"
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "rustls-tls"], optional = true }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"], optional = true }
serde_json = "1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"], optional = true }
sha2 = "0.10"
base64 = "0.22"

# SQLCipher's crypto: CommonCrypto on Apple; Android, Windows and Linux get a
# built-in OpenSSL, so the app never depends on the system's.
[target.'cfg(any(target_os = "android", target_os = "windows", target_os = "linux"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"], optional = true }


[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
rpassword = "7"
http = "1"

[[example]]
name = "live"
required-features = ["net"]

[[example]]
name = "mabini_live"
required-features = ["net"]
